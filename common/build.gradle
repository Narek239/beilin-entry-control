plugins {
	id "java-library"
	id "maven-publish"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

dependencies {
	// keep common free of Minecraft/Fabric deps
	api "com.google.code.gson:gson:2.10.1"
	api "com.squareup.okhttp3:okhttp:${rootProject.findProperty("okhttp_version")}"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

tasks.named("test", Test) {
	failOnNoDiscoveredTests = false
}

tasks.register("wsShutdownTest", JavaExec) {
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "us.beiyue.beilinentrycontrol.common.ws.BeilinWsClientShutdownTest"
}

tasks.register("wsExportJobsTest", JavaExec) {
	dependsOn tasks.named("testClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "us.beiyue.beilinentrycontrol.common.ws.BeilinWsClientExportJobsTest"
}

tasks.named("check") {
	dependsOn tasks.named("wsShutdownTest")
	dependsOn tasks.named("wsExportJobsTest")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "${rootProject.findProperty("archives_base_name") ?: "beilin-entry-control"}-common"
			from components.java
		}
	}
}
