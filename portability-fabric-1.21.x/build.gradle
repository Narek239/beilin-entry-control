plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "maven-publish"
}

base {
	archivesName = "beilin-data-portability-fabric-1.21.x"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"beilin-data-portability" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_121x_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_121x_version}"
	modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc1.21:7.3.8"

	implementation project(":common")
	implementation project(":portability-common")
	implementation "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"
	include project(":common")
	include project(":portability-common")
	include "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "beilin-data-portability-fabric-1.21.x"
			from components.java
		}
	}
}
